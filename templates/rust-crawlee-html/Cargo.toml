[package]
name = "crawlee-html-rust"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
description = "This is a boilerplate of an Apify Actor."
publish = false

[dependencies]
# Apify SDK - toolkit for building Apify Actors, with Crawlee re-exported as `apify::crawlee`
# (Read more at https://github.com/apify/apify-sdk-rs)
apify = { git = "https://github.com/apify/apify-sdk-rs", branch = "master" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
