name: Windows Defender exclusions
description: >
    Exclude the write-heavy CI paths from Microsoft Defender real-time scanning on
    Windows runners. No-op on every other platform.

# Why: the template harness unpacks hundreds of thousands of small files per job
# (a cold `npm install`/`uv sync` per template, plus browser archives). Defender
# scans each one, and that write penalty — not the network — is what makes the
# Windows legs 5-17x slower than the Ubuntu ones running identical work. Measured
# on run 33615217362: the pnpm store cache downloaded at 73.7 MB/s on Windows vs
# 81.8 MB/s on Ubuntu (parity), but took 5.6s to extract 58 MB versus 0.76s.

runs:
    using: composite
    steps:
        - name: Exclude CI paths from Defender real-time scanning
          if: runner.os == 'Windows'
          shell: pwsh
          # Best-effort by design: tamper protection can refuse Add-MpPreference on
          # some runner images, and losing the speedup must not fail the job.
          # Composite steps don't support continue-on-error, hence the try/catch.
          run: |
              $paths = @(
                  $env:RUNNER_TEMP
                  $env:TEMP
                  $env:GITHUB_WORKSPACE
                  # Browser and package archives all unpack under LOCALAPPDATA.
                  (Join-Path $env:LOCALAPPDATA 'ms-playwright')
                  (Join-Path $env:LOCALAPPDATA 'camoufox')
                  (Join-Path $env:LOCALAPPDATA 'npm-cache')
                  (Join-Path $env:LOCALAPPDATA 'pnpm')
                  (Join-Path $env:LOCALAPPDATA 'uv')
                  (Join-Path $env:LOCALAPPDATA 'pip')
              ) | Where-Object { $_ } | Select-Object -Unique

              try {
                  Add-MpPreference -ExclusionPath $paths -ErrorAction Stop
                  Add-MpPreference -ExclusionProcess @('node.exe', 'python.exe', 'uv.exe') -ErrorAction Stop
                  Write-Host 'Defender exclusions added:'
                  $paths | ForEach-Object { Write-Host "  $_" }
              } catch {
                  Write-Host "::warning::Could not add Defender exclusions, continuing unchanged: $($_.Exception.Message)"
              }

              exit 0
