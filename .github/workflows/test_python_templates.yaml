name: Test Python templates

on:
  workflow_call:

jobs:
  test-python-templates:
    name: Test Python templates
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
        # Duration-balanced template slice, see TEST_SHARD in test/templates.test.js.
        shard: ['1/2', '2/2']
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      # The Windows runners have two disks: C: is the network-backed Azure OS disk,
      # D: is host-local SSD. RUNNER_TEMP and the workspace are on D:, but TEMP/TMP
      # default to C:\Users\...\AppData\Local\Temp — and the harness installs every
      # template under os.tmpdir(). Measured in #907, 10k small files in a
      # node_modules-shaped tree: C: managed 744-1140 files/s against D:'s 4295-6008,
      # and 55-202 MB/s against D:'s 1012-1365 on a bulk write. Moving the harness cut
      # the Windows legs from a 12.1-15.3m mean to 6.7m, worst leg 24.3m -> 9.7m.
      # Harmless on Linux, where both paths are on one disk.
      # Set from a step because the `runner` context is not available in job-level env.
      - name: Install templates on the runner's fast disk
        shell: bash
        run: |
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install pnpm and dependencies
        uses: apify/workflows/pnpm-install@v0.50.0

      # --with-deps on Linux installs the apt libraries Chromium needs. On Windows it
      # installs the Media Foundation feature instead, which cost 3m16s of this step's
      # 3m30s — the browser downloads themselves take 15s. Media Foundation provides
      # video codecs; these templates only crawl pages, so skip it there.
      - name: Install playwright browsers
        run: pnpm exec playwright install chromium ${{ runner.os == 'Linux' && '--with-deps' || '' }}

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: templates/**/requirements.txt

      # For uv-based templates (e.g. python-uv); uv provides its own Python from .python-version.
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install Chrome and Chromedriver
        # Use pnpm dlx instead of npx — npx is the npm CLI and trips
        # devEngines.packageManager=pnpm at the repo root.
        run: |
          pnpm dlx @puppeteer/browsers install chrome
          pnpm dlx @puppeteer/browsers install chromedriver

      - name: Test Python templates
        run: pnpm run test-python-templates
        env:
          TEST_SHARD: ${{ matrix.shard }}
          # The camoufox browser fetch hits the GitHub releases API —
          # unauthenticated it flakes on runner-IP rate limits.
          GITHUB_TOKEN: ${{ github.token }}
          APIFY_TOKEN: ${{ secrets.APIFY_TEST_USER_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.APIFY_SERVICE_ACCOUNT_OPENAI_API_KEY }}
