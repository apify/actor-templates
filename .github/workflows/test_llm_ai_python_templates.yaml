name: Test LLM AI Python templates

on:
  workflow_call:
    secrets:
      APIFY_TEST_USER_API_TOKEN:
        required: false
      APIFY_SERVICE_ACCOUNT_OPENAI_API_KEY:
        required: false

jobs:
  test-llm-ai-python-templates:
    name: Test LLM AI Python templates
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      # The harness installs templates under os.tmpdir(); on Windows that is the
      # network-backed C: disk, ~5x slower at small files than D: (RUNNER_TEMP). #907
      - name: Install templates on the runner's fast disk
        shell: bash
        run: |
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Checkout repo
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install pnpm and dependencies
        uses: apify/actions/pnpm-install@v1.6.2

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: templates/**/requirements.txt

      - name: Test LLM AI Python templates
        run: pnpm run test-llm-ai-python-templates
        env:
          # Pull requests omit these secrets, so the harness limits itself to
          # structure and install checks instead of running the template code.
          HAS_REAL_SERVICE_SECRETS: ${{ secrets.APIFY_TEST_USER_API_TOKEN != '' && secrets.APIFY_SERVICE_ACCOUNT_OPENAI_API_KEY != '' }}
          APIFY_TOKEN: ${{ secrets.APIFY_TEST_USER_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.APIFY_SERVICE_ACCOUNT_OPENAI_API_KEY }}
