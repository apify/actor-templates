name: Test Templates

on:
  push:
    branches: [master]
    paths-ignore:
      - 'dist/**'
  pull_request:
    paths-ignore:
      - 'dist/**'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  python_lint_check:
    name: Python lint check (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: apify/actions/python-lint-check@v1.9.0
        with:
          python-version: ${{ matrix.python-version }}

  python_type_check:
    name: Python type check (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: apify/actions/python-type-check@v1.9.0
        with:
          python-version: ${{ matrix.python-version }}

  lint_and_test:
    name: Lint and test (without templates)
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install pnpm and dependencies
        uses: apify/actions/pnpm-install@v1.9.0

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Test building templates
        run: pnpm run build

      - name: Test template manifest
        run: pnpm run test-without-templates

  test-node-templates:
    name: Test Node.js templates
    uses: ./.github/workflows/test_node_templates.yaml
    secrets: inherit

  test-python-templates:
    if: github.event_name == 'pull_request'
    name: Test Python templates
    uses: ./.github/workflows/test_python_templates.yaml

  test-python-templates-trusted:
    if: github.event_name != 'pull_request'
    name: Test Python templates
    uses: ./.github/workflows/test_python_templates.yaml
    secrets:
      APIFY_TEST_USER_API_TOKEN: ${{ secrets.APIFY_TEST_USER_API_TOKEN }}
      APIFY_SERVICE_ACCOUNT_OPENAI_API_KEY: ${{ secrets.APIFY_SERVICE_ACCOUNT_OPENAI_API_KEY }}

  test-llm-ai-python-templates:
    if: github.event_name == 'pull_request'
    name: Test LLM AI Python templates
    uses: ./.github/workflows/test_llm_ai_python_templates.yaml

  test-llm-ai-python-templates-trusted:
    if: github.event_name != 'pull_request'
    name: Test LLM AI Python templates
    uses: ./.github/workflows/test_llm_ai_python_templates.yaml
    secrets:
      APIFY_TEST_USER_API_TOKEN: ${{ secrets.APIFY_TEST_USER_API_TOKEN }}
      APIFY_SERVICE_ACCOUNT_OPENAI_API_KEY: ${{ secrets.APIFY_SERVICE_ACCOUNT_OPENAI_API_KEY }}

  test-llm-ai-node-templates:
    name: Test LLM AI Node.js templates
    uses: ./.github/workflows/test_llm_ai_node_templates.yaml
    secrets: inherit

  test-docker-builds:
    name: Test Docker builds
    uses: ./.github/workflows/test_dockerfile_builds.yaml

  all-checks-passed:
    name: All checks passed
    if: always()
    needs:
      - python_lint_check
      - python_type_check
      - lint_and_test
      - test-node-templates
      - test-python-templates
      - test-python-templates-trusted
      - test-llm-ai-python-templates
      - test-llm-ai-python-templates-trusted
      - test-llm-ai-node-templates
      - test-docker-builds
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::Some checks failed or were cancelled"
            exit 1
          fi
          echo "All checks passed successfully"
