name: Test LLM AI Node.js templates

on:
  workflow_call:

jobs:
  test-llm-ai-node-templates:
    name: Test LLM AI Node.js templates
    strategy:
      matrix:
        # windows-2022, not windows-latest: js-langchain's native hnswlib-node addon
        # fails to build on windows-latest (VS 2026 isn't detected by node-gyp).
        # Removing the native dependency is tracked in #813.
        os: [ubuntu-24.04, windows-2022]
        node-version: [22]
        # Duration-balanced template slice, see TEST_SHARD in test/templates.test.js.
        shard: ['1/2', '2/2']
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      # The Windows runners have two disks: C: is the network-backed Azure OS disk,
      # D: is host-local SSD. RUNNER_TEMP and the workspace are on D:, but TEMP/TMP
      # default to C:\Users\...\AppData\Local\Temp — and the harness installs every
      # template under os.tmpdir(). Measured in #907, 10k small files in a
      # node_modules-shaped tree: C: managed 744-1140 files/s against D:'s 4295-6008,
      # and 55-202 MB/s against D:'s 1012-1365 on a bulk write. Moving the harness cut
      # the Windows legs from a 12.1-15.3m mean to 6.7m, worst leg 24.3m -> 9.7m.
      # Harmless on Linux, where both paths are on one disk.
      # Set from a step because the `runner` context is not available in job-level env.
      - name: Install templates on the runner's fast disk
        shell: bash
        run: |
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          # Playwright defaults to LOCALAPPDATA (C:) and always downloads fresh —
          # there is no image-provided cache to lose by relocating it. The Chrome
          # templates also pull Firefox and WebKit through a postinstall hook.
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"

      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm and dependencies
        uses: apify/workflows/pnpm-install@v0.46.0

      - name: Test LLM AI Node.js templates
        run: pnpm run test-llm-ai-node-templates
        env:
          TEST_SHARD: ${{ matrix.shard }}
          APIFY_TOKEN: ${{ secrets.APIFY_TEST_USER_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.APIFY_SERVICE_ACCOUNT_OPENAI_API_KEY }}
