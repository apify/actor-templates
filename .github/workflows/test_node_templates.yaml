name: Test Node.js templates

on:
  workflow_call:

jobs:
  test-node-templates:
    name: Test Node.js templates
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
        # pnpm v11 requires Node >= 22.13, and Node 20 is EOL since 2026-04, so the
        # test harness only runs on Node 22 and 24. Users can still author templates
        # targeting older Node versions in their own Actors.
        node-version: [22, 24]
        # Each shard runs a duration-balanced slice of the templates (TEST_SHARD in
        # test/templates.test.js) — the per-template install+run loop is serial,
        # so sharding is what parallelizes it.
        shard: ['1/4', '2/4', '3/4', '4/4']
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    # Pin Puppeteer's browser cache to one explicit dir shared by the pre-install step
    # below and the per-template install/run in the harness (avoids cross-template
    # cache corruption, mostly on Windows).
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/.puppeteer-cache

    steps:
      # The harness installs templates under os.tmpdir(); on Windows that is the
      # network-backed C: disk, ~5x slower at small files than D: (RUNNER_TEMP). #907
      - name: Install templates on the runner's fast disk
        shell: bash
        run: |
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm and dependencies
        uses: apify/workflows/pnpm-install@v0.46.0

      # --with-deps on Linux installs the apt libraries Chromium needs. On Windows it
      # installs the Media Foundation feature instead, which cost 3m16s of this step's
      # 3m30s — the browser downloads themselves take 15s. Media Foundation provides
      # video codecs; these templates only crawl pages, so skip it there.
      - name: Install playwright browsers
        run: pnpm exec playwright install chromium ${{ runner.os == 'Linux' && '--with-deps' || '' }}

      # Warm PUPPETEER_CACHE_DIR with the pinned browsers so templates don't race to
      # download Chrome during `npm install`.
      - name: Install puppeteer browsers
        run: pnpm exec puppeteer browsers install

      - name: Test Node.js templates
        run: pnpm run test-node-templates
        env:
          TEST_SHARD: ${{ matrix.shard }}
          # camoufox-js fetch (camoufox template postinstall) hits the GitHub
          # releases API — unauthenticated it flakes on runner-IP rate limits.
          GITHUB_TOKEN: ${{ github.token }}
          APIFY_TOKEN: ${{ secrets.APIFY_TEST_USER_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.APIFY_SERVICE_ACCOUNT_OPENAI_API_KEY }}
